name: Verify source and data boundaries
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web-and-local:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:desktop
      - run: node scripts/audit-public-release.mjs --history
      - name: Independent Git history secret scan
        shell: bash
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/gitleaks.tgz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --log-opts=--all --redact --no-banner --ignore-gitleaks-allow
      - name: Fresh database ownership and access tests
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-16
          PG_TEST_BIN=/usr/lib/postgresql/16/bin npm run test:database
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift build --package-path desktop/macos -c release
      - run: swift test --package-path desktop/macos
